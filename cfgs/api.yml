# api config

qwen:
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1  # or use VLLM server
  model: qwen1.5-32b-chat # qwen-long, qwen-plus, qwen1.5-32b-chat
  api_key: DASHSCOPE_API_KEY  # the os environment variable name
  batch_infer: False  # whether to use the batch inference
  concurrency_level: 1 # the concurrency level for api request

#deepseek:
#  base_url: https://api.deepseek.com/v1
#  model: deepseek-chat
#  api_key: DEEPSEEK_API_KEY  # the os environment variable name
#  batch_api: False  # whether to use the bacth api

deepseek:
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: deepseek-v3
  api_key: DASHSCOPE_API_KEY  # the os environment variable name, DEEPSEEK_API_KEY for official key from DeepSeek
  batch_infer: True  # whether to use the bacth api
  concurrency_level: 10 # the concurrency level for api request

gpt:
  base_url: https://jeniya.cn/v1
#  base_url: https://fastapi.top/v1
#  base_url: https://api.chatgpt-3.vip/v1
  model: gpt-4o-mini # gpt-4.1-nano, gpt-5-nano-2025-08-07, gpt-4o-mini, gpt-3.5-turbo(gpt-3.5-turbo-0125), gpt-3.5-turbo-instruct
  api_key: OPENAI_API_KEY  # the os environment variable name
  batch_infer: False  # whether to use the bacth api
  concurrency_level: 10 # the concurrency level for api request

